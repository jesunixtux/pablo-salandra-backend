# Modo independiente: H2 persistente en archivo, sin instalar MySQL ni XAMPP.
# Activar con --spring.profiles.active=standalone (o dev,standalone).
# Los datos quedan en ./data/bitacora.mv.db (relativo a donde se inicia el backend)
# y sobreviven a reinicios. Solo para demostraciones academicas y desarrollo local.
spring.datasource.url=${DB_URL:jdbc:h2:file:${DB_PATH:./data/bitacora};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
