# Motor MariaDB de XAMPP mediante el conector JDBC de MariaDB.
# Activar con --spring.profiles.active=xampp (o dev,xampp). No inicia ningun servidor:
# requiere que el modulo MySQL de XAMPP este escuchando en DB_PORT (3306 por defecto).
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bitacora}}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
