spring.application.name=pablo-salandra-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8090}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/bitacora?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.evidence-dir=${EVIDENCE_DIR:${user.home}/.local/share/pablo-salandra-backend/evidences}
//Activacion
spring.profiles.default=dev,xampp
